<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduacion — Telesecundaria 527</title>
<link rel="stylesheet" href="css/style.css?v=2">
<style>
html,body{height:100%;overflow:hidden;}
#mainContent{display:none;height:100vh;flex-direction:column;}
#mainContent.visible{display:flex;}
#pinGate{position:fixed;inset:0;background:var(--primary);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;}
#pinGate.hidden{display:none;}
#pinGate h2{margin-bottom:20px;font-size:clamp(1.1rem,3vw,1.4rem);}
#pinGate input{font-size:2rem;text-align:center;width:160px;padding:12px;border:3px solid var(--secondary);border-radius:12px;background:rgba(255,255,255,.1);color:#fff;letter-spacing:.4em;}
#pinGate input::placeholder{color:rgba(255,255,255,.3);}
#pinGate .pin-err{color:#e74c3c;margin-top:10px;font-size:.85rem;min-height:20px;}
.page-header{padding:8px 16px;}
.page-header h1{font-size:clamp(.9rem,2.5vw,1.2rem);}
.stats-row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.stat-box{flex:1;min-width:80px;background:#fff;border-radius:8px;padding:6px 8px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06);border-top:3px solid var(--secondary);}
.stat-box .num{font-size:clamp(1rem,2.5vw,1.4rem);font-weight:800;color:var(--primary);}
.stat-box .lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.04em;color:#888;}
.content-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 12px;display:flex;flex-direction:column;}
.galeria-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;padding-bottom:8px;}
.foto-card{position:relative;border-radius:6px;overflow:hidden;cursor:pointer;background:#eee;border:3px solid transparent;transition:border .2s,transform .1s;}
.foto-card:hover{transform:scale(1.02);}
.foto-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
.foto-card .lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);color:#fff;font-size:.6rem;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.foto-card .dl-btn{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:14px;line-height:1;transition:background .2s;z-index:2;}
.foto-card .dl-btn:hover{background:var(--secondary);color:var(--primary);}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;flex-direction:column;}
.modal.open{display:flex;}
.modal-top{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;flex-shrink:0;color:#fff;}
.modal-top .m-counter{font-size:.8rem;opacity:.7;}
.modal-top .m-close{background:none;border:none;color:#fff;font-size:1.6rem;cursor:pointer;padding:4px 8px;line-height:1;}
.modal-center{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0;}
.modal-center img{max-width:95%;max-height:100%;object-fit:contain;border-radius:4px;user-select:none;}
.modal-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:none;color:#fff;font-size:2rem;padding:12px 16px;cursor:pointer;border-radius:8px;line-height:1;transition:background .2s;z-index:5;}
.modal-nav:hover{background:rgba(255,255,255,.35);}
.modal-nav.prev{left:8px;}
.modal-nav.next{right:8px;}
.modal-bottom{flex-shrink:0;padding:10px 14px;color:#fff;background:rgba(0,0,0,.5);}
.modal-bottom .m-filename{font-size:.75rem;opacity:.6;margin-bottom:8px;word-break:break-all;}
.modal-bottom .m-actions{display:flex;gap:8px;}
.modal-bottom .m-actions a,.modal-bottom .m-actions button{padding:8px 14px;border-radius:6px;border:none;cursor:pointer;font-weight:600;font-size:.8rem;text-align:center;text-decoration:none;display:inline-block;}
.btn-download{background:var(--primary);color:#fff;}
.btn-download:hover{opacity:.9;}
.btn-close{background:rgba(255,255,255,.15);color:#fff;}
.pag-bar{display:flex;gap:4px;justify-content:center;padding:6px 0;flex-wrap:wrap;flex-shrink:0;}
.pag-bar button{padding:4px 10px;border:2px solid #e0e0e0;border-radius:6px;background:#fff;cursor:pointer;font-size:.78rem;}
.pag-bar button.active{background:var(--primary);color:#fff;border-color:var(--primary);}
footer{padding:6px 12px;font-size:.72rem;flex-shrink:0;}
@media(min-width:900px){
  .foto-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
  .content-area{padding:12px 20px;}
}
@media(max-width:480px){
  .foto-grid{grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:4px;}
  .stat-box{min-width:60px;padding:4px 4px;}
  .stat-box .num{font-size:.9rem;}
  .foto-card .dl-btn{width:24px;height:24px;font-size:12px;}
}
</style>
</head>
<body>

<div id="pinGate">
  <h2>Ingresa la clave</h2>
  <input type="password" id="pinInput" maxlength="4" placeholder="***" autofocus>
  <div class="pin-err" id="pinErr"></div>
</div>

<div id="mainContent">

<div class="page-header">
  <div><h1>&#127891; Graduacion</h1><p style="opacity:.7;font-size:.82rem;">Telesecundaria 527 &middot; 2026</p></div>
</div>

<div class="content-area">
  <div class="stats-row">
    <div class="stat-box"><div class="num" id="st-fotos">0</div><div class="lbl">Fotos</div></div>
  </div>
  <div class="pag-bar" id="pagBar"></div>
  <div class="galeria-scroll">
    <div class="foto-grid" id="fotoGrid"></div>
  </div>
  <div class="pag-bar" id="pagBar2"></div>
</div>

</div>

<div class="modal" id="modalFoto">
  <div class="modal-top">
    <span class="m-counter" id="mCounter"></span>
    <button class="m-close" onclick="cerrarModal()" title="Cerrar (Esc)">&times;</button>
  </div>
  <div class="modal-center" id="mCenter">
    <button class="modal-nav prev" onclick="navModal(-1)" title="Anterior">&lsaquo;</button>
    <img id="mImg" src="" alt="" onclick="navModal(1)">
    <button class="modal-nav next" onclick="navModal(1)" title="Siguiente">&rsaquo;</button>
  </div>
  <div class="modal-bottom">
    <div class="m-filename" id="mArchivo"></div>
    <div class="m-actions">
      <button class="btn-close" onclick="cerrarModal()">Cerrar</button>
      <a class="btn-download" id="mDescargar" href="#" download>Descargar</a>
    </div>
  </div>
</div>

<footer><p><strong>Producciones Foro 7</strong> &mdash; &#128241; 477-920-3776</p></footer>

<script src="js/graduacion_data.js?v=2"></script>
<script>
var PIN='791';
var PAGE_SIZE=60;
var currentPage=0;
var fotos=[];

document.getElementById('pinInput').addEventListener('input',function(){
  if(this.value===PIN){
    document.getElementById('pinGate').classList.add('hidden');
    document.getElementById('mainContent').classList.add('visible');
    init();
  }else if(this.value.length>=PIN.length){
    document.getElementById('pinErr').textContent='Clave incorrecta';
    this.value='';
  }
});

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function encPath(p){return p.split('/').map(encodeURIComponent).join('/');}

function getThumb(f){return encPath(GRADUACION.thumbs[f]||GRADUACION.normals[f]);}
function getNormal(f){return encPath(GRADUACION.normals[f]);}

function init(){
  if(typeof GRADUACION==='undefined'){
    document.getElementById('fotoGrid').innerHTML='<p style="padding:20px;color:#888;">No hay fotos disponibles aun.</p>';
    return;
  }
  fotos=GRADUACION.fotos;
  document.getElementById('st-fotos').textContent=fotos.length;
  renderGrid();
}

function renderGrid(){
  var grid=document.getElementById('fotoGrid');
  var totalPages=Math.ceil(fotos.length/PAGE_SIZE);
  var start=currentPage*PAGE_SIZE;
  var page=fotos.slice(start,start+PAGE_SIZE);

  grid.innerHTML=page.map(function(f){
    var thumb=getThumb(f);
    var normal=getNormal(f);
    var name=f.replace(/\.\w+$/,'');
    return '<div class="foto-card" onclick="abrirModal(\''+esc(f).replace(/'/g,"\\'")+'\')">'
      +'<a class="dl-btn" href="'+normal+'" download="'+esc(f)+'" onclick="event.stopPropagation()" title="Descargar">&#8681;</a>'
      +'<img src="'+thumb+'" loading="lazy" alt="'+esc(name)+'">'
      +'<div class="lbl">'+esc(name)+'</div>'
      +'</div>';
  }).join('');

  renderPag(totalPages);
}

function renderPag(totalPages){
  if(totalPages<=1){document.getElementById('pagBar').innerHTML='';document.getElementById('pagBar2').innerHTML='';return;}
  var html='<span style="font-size:.8rem;color:#888;">'+fotos.length+' fotos</span> ';
  for(var i=0;i<totalPages;i++){
    html+='<button class="'+(i===currentPage?'active':'')+'" onclick="irPagina('+i+')">'+(i+1)+'</button>';
  }
  document.getElementById('pagBar').innerHTML=html;
  document.getElementById('pagBar2').innerHTML=html;
}

function irPagina(p){currentPage=p;renderGrid();var s=document.querySelector('.galeria-scroll');if(s)s.scrollTop=0;}

var modalIdx=-1;

function abrirModal(file){
  modalIdx=fotos.indexOf(file);
  if(modalIdx<0)modalIdx=0;
  document.getElementById('modalFoto').classList.add('open');
  renderModalG();
}

function renderModalG(){
  if(modalIdx<0||modalIdx>=fotos.length)return;
  var file=fotos[modalIdx];
  var src=getNormal(file);
  document.getElementById('mImg').src=src;
  document.getElementById('mArchivo').textContent=file;
  document.getElementById('mCounter').textContent=(modalIdx+1)+' / '+fotos.length;
  var dl=document.getElementById('mDescargar');
  dl.href=src;dl.download=file;
}

function navModal(dir){
  var n=modalIdx+dir;
  if(n<0)n=fotos.length-1;
  if(n>=fotos.length)n=0;
  modalIdx=n;
  renderModalG();
}

function cerrarModal(){document.getElementById('modalFoto').classList.remove('open');modalIdx=-1;}

document.addEventListener('keydown',function(e){
  var modal=document.getElementById('modalFoto');
  if(!modal.classList.contains('open'))return;
  if(e.key==='Escape')cerrarModal();
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();navModal(-1);}
  else if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();navModal(1);}
});
</script>
</body>
</html>
